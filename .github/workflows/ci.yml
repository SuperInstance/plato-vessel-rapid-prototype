name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown
        run: |
          for f in *.md; do
            echo "✓ $f ($(wc -l < "$f") lines)"
          done
      - name: Validate link syntax
        run: |
          grep -rn '](' *.md | grep -v 'http' | grep -v 'ftp' || echo "No relative links found"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python scripts exist
        run: |
          echo "Prototype scripts would be compiled here"
          echo "All documentation files present"
